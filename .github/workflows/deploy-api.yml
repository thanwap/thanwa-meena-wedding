name: Deploy API

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test api/WeddingApi.sln --verbosity normal

      # serviceInstanceRedeploy only restarts the current build; DeployV2 builds this tag's commit.
      # GraphQL errors come back as HTTP 200, so check the body as well as the status.
      # Project tokens authenticate via Project-Access-Token, account/team tokens via Bearer.
      - name: Deploy to Railway
        run: |
          payload="{\"query\":\"mutation{serviceInstanceDeployV2(serviceId:\\\"31db35db-4d43-4776-95bd-ab23722afc7e\\\",environmentId:\\\"7dd9d131-a611-40ec-9f74-f0d54c3b9c4e\\\",commitSha:\\\"${GITHUB_SHA}\\\")}\"}"
          for auth in "Project-Access-Token: $RAILWAY_TOKEN" "Authorization: Bearer $RAILWAY_TOKEN"; do
            echo "Trying ${auth%%:*} header"
            response=$(curl -sS https://backboard.railway.app/graphql/v2 \
              -H "$auth" \
              -H "Content-Type: application/json" \
              -d "$payload")
            echo "$response"
            if echo "$response" | grep -q '"serviceInstanceDeployV2"' && ! echo "$response" | grep -q '"errors"'; then
              echo "Railway deploy triggered for ${GITHUB_SHA}"
              exit 0
            fi
          done
          echo "::error::Railway deploy failed"
          exit 1
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

